# Runs the whole stack locally: http://localhost:8080 (app) and http://localhost:8025 (sales inbox).
# Values come from .env if present (copy .env.example), otherwise the defaults below are used.
services:
  server:
    # Built from the repo root so the image can use the monorepo's single package-lock.json.
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      TRUST_PROXY: 1
      FAKESTORE_BASE_URL: ${FAKESTORE_BASE_URL:-https://fakestoreapi.com}
      FEATURED_PRODUCT_IDS: ${FEATURED_PRODUCT_IDS:-3,5,11,12,18}
      SALES_INBOX_EMAIL: ${SALES_INBOX_EMAIL:-sales@example.com}
      EMAIL_FROM: ${EMAIL_FROM:-Product Catalogue <no-reply@example.com>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - mailpit
    restart: unless-stopped
    # Not published to the host: only reachable through the client's nginx proxy.

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Local SMTP server and web inbox standing in for the sales mailbox. No account needed.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP, so the API can also send mail when run outside Docker (npm run dev)
    restart: unless-stopped
