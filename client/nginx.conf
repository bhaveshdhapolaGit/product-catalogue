server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off; # don't reveal the nginx version

  # Same-origin API: the browser only ever talks to this host, so no CORS is needed.
  # (The API adds its own security headers using helmet.)
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built JS and CSS files have a unique hash in their names, so browsers can cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The web page itself. Unknown paths also get index.html, because React handles the routing.
  # Note: nginx ignores server-level add_header lines in a location that has its own, so the
  # security headers are listed here.
  location / {
    add_header Cache-Control "no-cache";
    # Only load scripts, styles, images and data from our own site; never allow other sites to frame it.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always; # same as frame-ancestors, for older browsers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
}
